services:
  load-balancer:
    build: ./load-balancer
    container_name: load-balancer
    volumes:
      - ./load-balancer/config.yml:/app/config.yml
    ports:
      - "8000:80"
    env_file:
      - ./load-balancer/.env

  backend1:
    build: ./backend-api
    container_name: backend1
    ports:
      - "5001:5000"
    env_file:
      - ./backend-api/.env

  backend2:
    build: ./backend-api
    container_name: backend2
    ports:
      - "5002:5000"
    env_file:
      - ./backend-api/.env

  backend3:
    build: ./backend-api
    container_name: backend3
    ports:
      - "5003:5000"
    env_file:
      - ./backend-api/.env