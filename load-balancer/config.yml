listeners:
  - path_prefix: "/api"
    path_rewrite: "/v1"
    target_group: "backend"

target_groups:
  - name: "backend"
    session_ttl: 3000
    targets:
      - hostname: "192.168.0.12"
        port: 5001
        weight: 3
        healthcheck:
          path: "/health"
          status_code: 
            - 200
          timeout: 2
      - hostname: "192.168.0.12"
        port: 5002
        weight: 2
        healthcheck:
          path: "/health"
          status_code:
            - 200
          timeout: 2
      - hostname: "192.168.0.12"
        port: 5003
        weight: 1
        healthcheck:
          path: "/health"
          status_code:
            - 200
          timeout: 2
